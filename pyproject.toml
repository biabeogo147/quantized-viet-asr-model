[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-model-test"
version = "0.1.0"
description = "Deterministic Zipformer and VPCD model pipeline for BKMeeting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
onnx = [
  "onnx>=1.17,<2",
  "onnxruntime-extensions>=0.14,<1",
  "transformers>=5.3,<6",
  "sentencepiece>=0.2,<1",
]
runtime-cpu = [
  "onnxruntime==1.22.0",
]
runtime-gpu = [
  "onnxruntime-gpu==1.22.0",
]
datasets = [
  "pyarrow>=20,<24",
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
]
aihub = [
  "qai-hub>=0.49,<1",
]
test = [
  "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "asset_contract: validates large locally materialized canonical model assets",
]
